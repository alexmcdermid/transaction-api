server.port=8080
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:P1D}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=${APP_SESSION_COOKIE_MAX_AGE:P7D}
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:lax}

spring.application.name=transaction-api

spring.datasource.url=${DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:300000}
spring.datasource.hikari.keepalive-time=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.enabled=false
app.security.jwt.issuer-uri=https://accounts.google.com
app.security.jwt.audience=
app.security.jwt.jwk-source=issuer
app.security.jwt.jwk-set-uri=
app.security.jwt.jwk-set=
app.security.jwt.jws-algorithms=RS256
app.security.jwt.jwk-refresh-interval=PT15M
app.security.jwt.dynamo.table=AuthJwks
app.security.jwt.dynamo.key-attribute=provider
app.security.jwt.dynamo.key=google
app.security.jwt.dynamo.jwk-set-attribute=jwks
app.security.jwt.dynamo.expires-at-attribute=expiresAt
app.security.jwt.dynamo.max-stale=PT72H
app.security.allow-header-auth=false
app.security.header-name=X-User-Id
app.security.dev-user-id=
app.security.session.absolute-timeout=${APP_SESSION_ABSOLUTE_TIMEOUT:P7D}
app.rate-limit.trust-forwarded-headers=${APP_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
app.rate-limit.max-buckets=${APP_RATE_LIMIT_MAX_BUCKETS:10000}

# Tax year pass checkout: Stripe Payment Link + signed webhook. Set all three or leave all three blank to disable checkout.
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.tax-year-pass.payment-link-url=${APP_TAX_YEAR_PASS_PAYMENT_LINK_URL:}
# The Payment Link's plink_ id. The webhook ignores checkout sessions from any other link.
app.billing.tax-year-pass.payment-link-id=${APP_TAX_YEAR_PASS_PAYMENT_LINK_ID:}
# Display-only list price (minor units + ISO code). Stripe remains the source of truth for charges.
app.billing.tax-year-pass.price-cents=${APP_TAX_YEAR_PASS_PRICE_CENTS:}
app.billing.tax-year-pass.price-currency=${APP_TAX_YEAR_PASS_PRICE_CURRENCY:}
